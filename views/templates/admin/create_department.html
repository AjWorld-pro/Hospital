{% extends "base.html" %}
{% block title %}Create Department{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow-sm">
    <div class="card-header bg-white"><h5 class="mb-0"><i class="bi bi-building-add"></i> New Department</h5></div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3"><label class="form-label">Department Name *</label><input type="text" name="name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
            <div class="mb-3"><label class="form-label">Location</label><input type="text" name="location" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control"></div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i> Create Department</button>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
