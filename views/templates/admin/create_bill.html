{% extends "base.html" %}
{% block title %}Create Bill{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0"><i class="bi bi-credit-card"></i> Create Bill</h5></div>
            <div class="card-body">
                <form method="POST" id="billForm">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">Patient *</label>
                            <select name="patient_id" class="form-select patient-select" required>
                                <option value="">Search patient by name or phone...</option>
                                {% for p in patients %}<option value="{{ p.id }}">{{ p.full_name }} - {{ p.phone }} ({{ p.gender }}, Age {{ p.age }})</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <hr>
                    <h6 class="text-primary">Standard Charges</h6>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Consultation Fee</label><input type="number" step="0.01" name="consultation_fee" class="form-control charge-input" value="0" oninput="calcTotals()"></div>
                        <div class="col-md-4"><label class="form-label">Lab Charges</label><input type="number" step="0.01" name="lab_charges" class="form-control charge-input" value="0" oninput="calcTotals()"></div>
                        <div class="col-md-4"><label class="form-label">Medication Charges</label><input type="number" step="0.01" name="medication_charges" class="form-control charge-input" value="0" oninput="calcTotals()"></div>
                        <div class="col-md-4"><label class="form-label">Procedure Charges</label><input type="number" step="0.01" name="procedure_charges" class="form-control charge-input" value="0" oninput="calcTotals()"></div>
                        <div class="col-md-4"><label class="form-label">Room Charges</label><input type="number" step="0.01" name="room_charges" class="form-control charge-input" value="0" oninput="calcTotals()"></div>
                        <div class="col-md-4"><label class="form-label">Other Charges</label><input type="number" step="0.01" name="other_charges" class="form-control charge-input" value="0" oninput="calcTotals()"></div>
                    </div>
                    <hr>
                    <h6 class="text-primary">Itemized Services</h6>
                    <div id="itemsContainer">
                        <div class="row g-2 mb-2 item-row">
                            <div class="col-4"><input type="text" name="item_name[]" class="form-control" placeholder="Item name"></div>
                            <div class="col-3">
                                <select name="item_type[]" class="form-select">
                                    <option value="consultation">Consultation</option>
                                    <option value="lab">Lab</option>
                                    <option value="medication">Medication</option>
                                    <option value="procedure">Procedure</option>
                                    <option value="room">Room</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="col-2"><input type="number" name="item_qty[]" class="form-control item-qty" placeholder="Qty" value="1" min="1" oninput="calcItemTotal(this)"></div>
                            <div class="col-2"><input type="number" step="0.01" name="item_price[]" class="form-control item-price" placeholder="Price" value="0" min="0" oninput="calcItemTotal(this)"></div>
                            <div class="col-1 d-flex align-items-center">
                                <span class="item-line-total text-muted small">$0.00</span>
                                <button type="button" class="btn btn-sm btn-outline-danger ms-1" onclick="this.closest('.item-row').remove(); calcTotals();"><i class="bi bi-x"></i></button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-primary mb-3" onclick="addItemRow()"><i class="bi bi-plus-lg"></i> Add Item</button>
                    <hr>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Subtotal</label><input type="text" class="form-control" id="subtotalDisplay" value="$0.00" readonly></div>
                        <div class="col-md-4"><label class="form-label">Discount</label><input type="number" step="0.01" name="discount" class="form-control charge-input" value="0" oninput="calcTotals()"></div>
                        <div class="col-md-4"><label class="form-label">Tax</label><input type="number" step="0.01" name="tax" class="form-control charge-input" value="0" oninput="calcTotals()"></div>
                        <div class="col-md-6"><label class="form-label">Total Amount</label><input type="text" class="form-control fw-bold" id="totalDisplay" value="$0.00" readonly></div>
                        <div class="col-md-6"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
                    </div>
                    <input type="hidden" name="itemized_total" id="itemizedTotal" value="0">
                    <button type="submit" class="btn btn-primary w-100 mt-3"><i class="bi bi-save"></i> Create Bill</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_css %}
<style>
.select2-container .select2-selection--single { height: 36px !important; }
.select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 34px !important; }
</style>
{% endblock %}
{% block extra_js %}
<script>
$(function() { $('.patient-select').select2({ placeholder: 'Search patient by name or phone...', width: '100%' }); });
function addItemRow() {
    const container = document.getElementById('itemsContainer');
    const row = document.createElement('div');
    row.className = 'row g-2 mb-2 item-row';
    row.innerHTML = `
        <div class="col-4"><input type="text" name="item_name[]" class="form-control" placeholder="Item name"></div>
        <div class="col-3">
            <select name="item_type[]" class="form-select">
                <option value="consultation">Consultation</option>
                <option value="lab">Lab</option>
                <option value="medication">Medication</option>
                <option value="procedure">Procedure</option>
                <option value="room">Room</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="col-2"><input type="number" name="item_qty[]" class="form-control item-qty" placeholder="Qty" value="1" min="1" oninput="calcItemTotal(this)"></div>
        <div class="col-2"><input type="number" step="0.01" name="item_price[]" class="form-control item-price" placeholder="Price" value="0" min="0" oninput="calcItemTotal(this)"></div>
        <div class="col-1 d-flex align-items-center">
            <span class="item-line-total text-muted small">$0.00</span>
            <button type="button" class="btn btn-sm btn-outline-danger ms-1" onclick="this.closest('.item-row').remove(); calcTotals();"><i class="bi bi-x"></i></button>
        </div>`;
    container.appendChild(row);
}
function calcItemTotal(el) {
    const row = el.closest('.item-row');
    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
    const price = parseFloat(row.querySelector('.item-price').value) || 0;
    row.querySelector('.item-line-total').textContent = '$' + (qty * price).toFixed(2);
    calcTotals();
}
function calcTotals() {
    let itemsTotal = 0;
    document.querySelectorAll('.item-row').forEach(function(row) {
        const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        itemsTotal += qty * price;
    });
    let charges = 0;
    document.querySelectorAll('.charge-input').forEach(function(el) {
        charges += parseFloat(el.value) || 0;
    });
    const subtotal = charges + itemsTotal;
    const discount = parseFloat(document.querySelector('[name="discount"]').value) || 0;
    const tax = parseFloat(document.querySelector('[name="tax"]').value) || 0;
    const total = subtotal + tax - discount;
    document.getElementById('subtotalDisplay').value = '$' + subtotal.toFixed(2);
    document.getElementById('totalDisplay').value = '$' + total.toFixed(2);
    document.getElementById('itemizedTotal').value = itemsTotal.toFixed(2);
}
</script>
{% endblock %}
