{% extends "base.html" %}
{% block title %}Discharge Patient{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-warning">
            <div class="card-header bg-warning text-dark"><h5 class="mb-0"><i class="bi bi-box-arrow-right"></i> Discharge Patient: {{ patient.full_name }}</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Discharge Summary *</label>
                        <textarea name="discharge_summary" class="form-control" rows="6" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Diagnosis</label>
                        <textarea name="diagnosis" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Treatment Plan / Follow-up Instructions</label>
                        <textarea name="treatment_plan" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i> This action will mark the patient as discharged.
                    </div>
                    <button type="submit" class="btn btn-warning w-100"><i class="bi bi-box-arrow-right"></i> Confirm Discharge</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
